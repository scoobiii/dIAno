name: VUA Connector AI & Vortex Governance CI/CD

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'vua/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: 'vua-governance-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  vortex-quality-gates:
    name: Vortex Agent Governance & VFB Connectome Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Verified Dependencies
        run: npm install --no-audit --no-fund

      - name: Gate 1 - TypeScript Verification & Static Analysis
        run: npm run lint

      - name: Gate 2 - Production Bundle Build
        run: npm run build

      - name: Gate 3 - Vortex Governance Contract
        run: |
          set -euo pipefail
          echo "Vortex governance gate: PASS only when the executable checks above pass."
          echo "Target: https://github.com/scoobiii/vua"
          echo "Connectome provenance: FlyWire / VirtualFlyBrain"

  deploy-github-pages:
    name: Dynamic GitHub Pages Deployment
    needs: vortex-quality-gates
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build
        run: npm install --no-audit --no-fund

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
