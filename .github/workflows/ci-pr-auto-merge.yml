name: CI Push to PR

on:
  push:
    branches-ignore:
      - main
      - 'gh-pages'

permissions:
  contents: write
  pull-requests: write

jobs:
  quality-and-pr:
    name: Quality Gates & Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript Verification & Lint
        run: npm run lint

      - name: Production Build
        run: npm run build

      - name: Create or reuse Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
            gh pr create               --base main               --head "$BRANCH_NAME"               --title "feat(auto-ci): $COMMIT_MSG"               --body "Automated PR created after local CI quality gates.

Merge policy:
- This workflow NEVER merges pull requests.
- All required PR governance checks must pass before merge.
- Human review/branch protection remains authoritative.

Required governance is fail-closed: pending, skipped, cancelled or failed required checks do not authorize merge."
          else
            echo "PR #$EXISTING_PR already exists."
          fi

      - name: Explicit fail-closed merge policy
        run: |
          echo "PASS: CI is not authorized to merge."
          echo "Merge can occur only through the repository PR policy after required checks pass."
